name: Controleer webapp
on:
  push:
    branches: [main]
    paths:
      - app.js
      - agenda.js
      - agenda-drag.js
      - agenda.css
      - index.html
      - stack-dashboard.css
      - tests/**
      - .github/workflows/test-frontend.yml
  pull_request:
    paths:
      - app.js
      - agenda.js
      - agenda-drag.js
      - agenda.css
      - index.html
      - tests/**
      - .github/workflows/test-frontend.yml
jobs:
  browserlogic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check agenda.js && node --check agenda-drag.js
      - run: node --test tests/*.test.mjs
      - name: Installeer Chromium voor schermtest
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test STACK in echte browser
        run: node --test tests/browser/stack.test.mjs
