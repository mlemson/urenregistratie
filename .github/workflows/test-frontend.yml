name: Controleer webapp
on:
  push:
    branches: [main]
    paths:
      - app.js
      - agenda.js
      - agenda-drag.js
      - agenda.css
      - index.html
      - tests/**
      - .github/workflows/test-frontend.yml
  pull_request:
    paths:
      - app.js
      - agenda.js
      - agenda-drag.js
      - agenda.css
      - index.html
      - tests/**
      - .github/workflows/test-frontend.yml
jobs:
  browserlogic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check agenda.js && node --check agenda-drag.js
      - run: node --test tests/*.test.mjs
