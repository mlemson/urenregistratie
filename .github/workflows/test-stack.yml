name: Test STACK-verbinding
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/test-stack.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/test-stack.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testen zonder echte STACK-gegevens
        run: npm test
        working-directory: server