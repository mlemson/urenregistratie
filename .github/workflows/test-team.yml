name: Test bedrijfsomgeving
on:
  push:
    paths: ['team/**', '.github/workflows/test-team.yml']
  pull_request:
    paths: ['team/**', '.github/workflows/test-team.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check team/team.js && node --check team/server/worker.mjs
      - run: node --test team/tests/*.test.mjs