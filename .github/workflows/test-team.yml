name: Test bedrijfsomgeving
on:
  push:
    paths: ['team/**', '.github/workflows/test-team.yml']
  pull_request:
    paths: ['team/**', '.github/workflows/test-team.yml']
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check team/team.js && node --check team/server/worker.mjs
      - name: Controleer publieke build en vernieuwde assets
        run: |
          node --check team/server/prepare-assets.mjs
          node team/server/prepare-assets.mjs
          grep -q 'application-build' team/server/public/team/index.html
          grep -q 'team.css?v=' team/server/public/team/index.html
          grep -q 'team.js?v=' team/server/public/team/index.html
      - run: node --test team/tests/team.test.mjs
      - name: Controleer extern postcode- en routeverkeer met openbare voorbeeldpostcodes
        continue-on-error: true
        run: node --input-type=module -e "import {routeDistance} from './team/server/worker.mjs'; const r=await routeDistance({from:'1012AB',to:'1012NX'},{}); if(!Number.isFinite(r.km)||r.km<0)throw Error('Geen geldige route'); console.log('Live probe:',r);"
      - run: npm install --prefix team --no-save --package-lock=false playwright@1.56.1
      - run: team/node_modules/.bin/playwright install --with-deps chromium
      - run: node --test team/tests/browser.test.mjs