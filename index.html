<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f4f0">
<title>LA · Uren en kilometers</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="agenda.css">
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script defer src="seed.js"></script>
<script defer src="agenda.js"></script>
<script defer src="agenda-drag.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<div class="app-shell">
  <header class="masthead">
    <div class="brand"><span class="brand-icon" id="brandIcon">U</span><div><strong id="brandName">Urenregistratie</strong><small>Uren en kilometers</small></div></div>
    <div class="header-actions">
      <div class="year-choice"><label for="year">Jaar</label><select id="year"><option>2026</option><option>2027</option></select></div>
      <div class="login-status-group"><button class="save-status" id="syncButton" type="button" title="Inloggen"><span id="syncDot" class="dot amber"></span><span id="syncLabel">Niet ingelogd</span></button><span id="syncDetail" class="sync-detail" hidden></span></div>
    </div>
  </header>
  <nav class="tabs" aria-label="Hoofdnavigatie" hidden>
    <button class="tab active" data-page="agenda">Agenda</button>
    <button class="tab" data-page="registreren">Registreren</button>
    <button class="tab" data-page="projecten">Projecten</button>
    <button class="tab" data-page="declaraties">Declaraties</button>
    <button class="tab" data-page="overzicht">Overzicht</button>
    <button class="tab" data-page="instellingen">Instellingen</button>
  </nav>
  <div id="notice" class="notice" hidden></div>
  <main id="app"></main>
  <footer class="footer"><span id="fileName"></span><span id="footerHint"></span></footer>
</div>
<div id="dialogRoot"></div>
</body>
</html>
