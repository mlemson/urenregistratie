name = "urenregistratie-team-test"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false
keep_vars = true

[vars]
APP_ORIGIN = "https://urenregistratie-team-test.mauricelemson.workers.dev,https://mlemson.github.io,https://boekuur.nl,https://www.boekuur.nl"
# No unverified new users on pilot database. Configure separately for production.
PUBLIC_SIGNUP_ENABLED = "false"
VERIFY_URL = "https://boekuur.nl/bedrijfsomgeving/verifieren.html"
# Set MAIL_FROM to an address at a verified sending domain only after DNS verification.
# Set RESEND_API_KEY as an encrypted Cloudflare Worker secret (never in this file).

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "testdatabase"
database_id = "8de423c1-c45b-454a-8d1c-cca8920956b1"
migrations_dir = "migrations"
