<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://urenregistratie-team-test.mauricelemson.workers.dev; base-uri 'none'; form-action 'none'">
<title>E-mailadres bevestigen | Boekuur</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f3;color:#203d35;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}.card{background:white;max-width:460px;width:100%;padding:34px;border:1px solid #dce8df;border-radius:17px;box-shadow:0 8px 25px #20472f10}h1{font-size:27px;letter-spacing:-.035em;line-height:1.2;margin:0 0 15px}p{color:#55685b}button,.button{display:inline-block;border:0;border-radius:9px;background:#266e58;color:white;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:default}a{color:#246f54}.error{color:#a12d2d}.ok{color:#28644e}
</style>
</head>
<body><main class="card"><h1>E-mailadres bevestigen</h1><p id="message">Controleer je aanmelding met de knop hieronder.</p><p><button type="button" id="verify" disabled>Account bevestigen</button></p><p><a href="./">Terug naar inloggen</a></p></main>
<script>
(()=>{'use strict';
 const API=location.hostname.endsWith('.workers.dev')?location.origin:'https://urenregistratie-team-test.mauricelemson.workers.dev';
 const qs=new URLSearchParams(location.hash.slice(1));let token=qs.get('token')||'';
 history.replaceState(null,'',location.pathname);
 const btn=document.getElementById('verify'),message=document.getElementById('message');
 if(!/^[a-f0-9]{64}$/.test(token)){token='';message.textContent='Geen geldige bevestigingscode gevonden. Open de oorspronkelijke link uit je e-mail.';message.className='error';return;}
 btn.disabled=false;
 btn.addEventListener('click',async()=>{
  btn.disabled=true;message.textContent='Bezig met bevestigen…';
  try{
   const r=await fetch(API+'/signup/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store',redirect:'error'});
   const answer=await r.json();
   token='';
   if(!r.ok)throw Error(answer.error||'Bevestigen is niet gelukt.');
   message.className='ok';
   message.textContent='Je e-mailadres is bevestigd. Je bedrijf is aangemaakt. Je kunt nu inloggen met je bedrijfscode, e-mailadres en wachtwoord.';
   btn.remove();
  }catch(err){token='';message.className='error';message.textContent=err.message||'Bevestigen is niet gelukt. Vraag een nieuwe link aan.';btn.remove();}
 });
})();
</script>
</body></html>
