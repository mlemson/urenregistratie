name = "la-uren-stack"
main = "worker.js"
compatibility_date = "2026-10-01"

# Publiek adres van de GitHub Pages-app. Dit is geen geheim.
[vars]
APP_ORIGIN = "https://mlemson.github.io"

# Andere instellingen horen in de Cloudflare Worker-omgeving:
